<!doctype html>
<!--
  Borealis look-dev page. NOT shipped — fast iteration surface for the shader
  before the QML/qsb port. The fragment shader below is written to port
  mechanically into Qt6 ShaderEffect (qsb #version 440):

  - uv has y = 0 at the TOP (matches qt_TexCoord0); the wrapper flips
    gl_FragCoord for WebGL.
  - all scene math lives in scene(uv, time); the qsb file wraps the same
    function with the std140 uniform block instead of these uniforms.
  - palettes arrive as uniform arrays (vec3 stops + float positions), the
    same shape the ShaderEffect properties will use.

  Source of truth for the math: play/aurora.py (Sky.frame, line refs inline).
  Keys: 1-5 switch palettes (aurora / ember / gold / nord / ice).
-->
<html>
<head>
<meta charset="utf-8">
<title>Borealis look-dev</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { width: 100vw; height: 100vh; display: block; }
  #hud { position: fixed; left: 12px; bottom: 10px; color: #9ab;
         font: 12px monospace; opacity: 0.7; user-select: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>

<script id="frag" type="x-shader/fragment">#version 300 es
precision highp float;

uniform float time;
uniform vec2 resolution;
// 6-stop palette ramp + sky tint — same shape as the future ShaderEffect props.
uniform float rampP[6];
uniform vec3  rampC[6];
uniform vec3  skyBase;
uniform vec3  skyAmp;

out vec4 fragColor;

// piecewise-linear ramp, aurora.py ramp()/np.interp (clamped at both ends)
vec3 ramp(float p) {
  if (p <= rampP[0]) return rampC[0];
  for (int i = 1; i < 6; i++) {
    if (p <= rampP[i]) {
      float f = (p - rampP[i-1]) / (rampP[i] - rampP[i-1]);
      return mix(rampC[i-1], rampC[i], f);
    }
  }
  return rampC[5];
}

// integer-free hash for the starfield gather (slice-2 preview)
float hash21(vec2 p) {
  p = fract(p * vec2(234.34, 435.345));
  p += dot(p, p + 34.23);
  return fract(p.x * p.y);
}

// One curtain layer — aurora.py Sky.frame lines 259-287.
// uv.y is 0 at top, 1 at bottom, matching Y/H in the source.
vec3 curtain(vec2 uv, float t,
             float baseY, float len, float alpha,
             vec3 f, vec3 a, vec3 s,     // three edge waves: freq, amp, speed
             float rayF, float rayS) {
  float fx = uv.x;

  // wavy top edge: top = base_y + sum amp*sin(fx*freq*2pi + t*spd)   (l. 260-262)
  float top = baseY
    + a.x * sin(fx * f.x * 6.28318 + t * s.x)
    + a.y * sin(fx * f.y * 6.28318 + t * s.y)
    + a.z * sin(fx * f.z * 6.28318 + t * s.z);

  // rel: 0 at edge -> 1 at hem                                       (l. 266)
  float rel = (uv.y - top) / len;
  float inside = step(0.0, rel) * step(rel, 1.0);

  // hem fade + soft lip at the top line                              (l. 270-272)
  float b = clamp(1.0 - rel, 0.0, 1.0) * clamp(rel / 0.04, 0.0, 1.0) * inside;

  // vertical ray filaments, sharpened into streaks                   (l. 275-281)
  float rays = 0.55
    + 0.30 * sin(fx * rayF + t * rayS)
    + 0.15 * sin(fx * rayF * 2.3 - t * rayS * 1.7);
  b *= pow(clamp(rays, 0.0, 1.0), 1.6);

  // slow breathing of the whole curtain                              (l. 284)
  b *= 0.75 + 0.25 * sin(t * 0.6 + baseY * 9.0);

  return ramp(rel) * b * alpha;
}

vec4 scene(vec2 uv, float t) {
  // sky gradient: base + amp*(1 - vert), vert = y/H                  (l. 145-150)
  vec3 col = skyBase + skyAmp * (1.0 - uv.y);

  // starfield — gather form of the scatter at l. 152-160 + 253-256.
  // grid cells; roughly half hold a star, kept above 0.7 sky height.
  if (uv.y < 0.7) {
    vec2 g = uv * resolution / 14.0;          // ~14px cells
    vec2 cell = floor(g);
    float h = hash21(cell);
    if (h > 0.55) {
      vec2 pos = vec2(hash21(cell + 7.3), hash21(cell + 3.1));
      float d = length((fract(g) - pos) * 14.0);
      float mag = 0.3 + 0.7 * hash21(cell + 11.7);
      float twk = 0.55 + 0.45 * sin(t * (1.5 + 2.5 * hash21(cell + 5.2))
                                    + 6.28318 * hash21(cell + 9.4));
      float star = smoothstep(1.2, 0.0, d) * mag * twk * 0.78;
      col += star * vec3(0.85, 0.9, 1.0);
    }
  }

  // three curtain layers, aurora.py self.layers                      (l. 134-139)
  col += curtain(uv, t, 0.18, 0.55, 1.00,
                 vec3(1.3, 2.7, 5.1), vec3(0.05, 0.03, 0.015),
                 vec3(0.21, -0.13, 0.31), 23.0, 0.7);
  col += curtain(uv, t, 0.30, 0.42, 0.75,
                 vec3(0.9, 2.1, 4.3), vec3(0.06, 0.035, 0.02),
                 vec3(-0.15, 0.19, -0.27), 17.0, -0.5);
  col += curtain(uv, t, 0.42, 0.32, 0.55,
                 vec3(1.7, 3.3, 6.5), vec3(0.04, 0.025, 0.012),
                 vec3(0.11, -0.23, 0.17), 31.0, 0.9);

  // mountain ridge silhouette, occludes last                         (l. 163-170, 294-295)
  float fx = uv.x;
  float ridge = 0.5
    + 0.30 * sin(fx * 3.1 + 0.6)
    + 0.12 * sin(fx * 7.7 + 2.0)
    + 0.06 * sin(fx * 15.3 + 4.1);
  ridge /= 0.98;                              // analytic stand-in for /max()
  float ridgeTop = 1.0 - ridge * 0.16;
  if (uv.y >= ridgeTop) col = vec3(5.0, 6.0, 11.0) / 255.0;

  return vec4(clamp(col, 0.0, 1.0), 1.0);
}

void main() {
  // flip to Qt's y-down texture coords so scene() ports verbatim
  vec2 uv = vec2(gl_FragCoord.x, resolution.y - gl_FragCoord.y) / resolution;
  fragColor = scene(uv, time);
}
</script>

<script>
// Palettes copied from play/aurora.py PALETTES, /255.
const PALETTES = {
  aurora: { p: [0.00,0.12,0.30,0.55,0.80,1.00],
    c: [[150,45,180],[90,110,205],[35,200,200],[30,235,130],[25,180,80],[8,70,35]],
    skyBase: [6,8,18], skyAmp: [8,10,22] },
  ember: { p: [0.00,0.15,0.35,0.60,0.82,1.00],
    c: [[200,40,150],[225,60,95],[235,75,60],[240,120,40],[180,70,22],[60,20,12]],
    skyBase: [10,6,12], skyAmp: [16,8,14] },
  gold: { p: [0.00,0.15,0.35,0.60,0.82,1.00],
    c: [[120,70,20],[180,120,35],[225,165,55],[245,205,110],[235,175,90],[60,40,14]],
    skyBase: [10,8,6], skyAmp: [16,12,8] },
  nord: { p: [0.00,0.18,0.40,0.62,0.82,1.00],
    c: [[180,142,173],[129,161,193],[136,192,208],[143,188,187],[163,190,140],[90,110,75]],
    skyBase: [12,14,18], skyAmp: [20,24,34] },
  ice: { p: [0.00,0.15,0.35,0.60,0.82,1.00],
    c: [[60,90,200],[60,150,230],[90,210,235],[160,235,240],[130,185,160],[20,45,75]],
    skyBase: [6,9,22], skyAmp: [8,14,26] },
};
const NAMES = Object.keys(PALETTES);

const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl2");
const hud = document.getElementById("hud");

const vsrc = `#version 300 es
void main() {
  vec2 v = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  gl_Position = vec4(v * 2.0 - 1.0, 0.0, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsrc));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER,
  document.getElementById("frag").textContent));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
  throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const U = n => gl.getUniformLocation(prog, n);

let palette = new URLSearchParams(location.search).get("palette") || "aurora";
if (!PALETTES[palette]) palette = "aurora";

function setPalette(name) {
  palette = name;
  const P = PALETTES[name];
  gl.uniform1fv(U("rampP"), P.p);
  gl.uniform3fv(U("rampC"), P.c.flat().map(v => v / 255));
  gl.uniform3f(U("skyBase"), ...P.skyBase.map(v => v / 255));
  gl.uniform3f(U("skyAmp"), ...P.skyAmp.map(v => v / 255));
  hud.textContent = `borealis look-dev — palette: ${name} (keys 1-5: ${NAMES.join(", ")})`;
}
setPalette(palette);

addEventListener("keydown", e => {
  const i = "12345".indexOf(e.key);
  if (i >= 0) setPalette(NAMES[i]);
});

function resize() {
  canvas.width = innerWidth * devicePixelRatio;
  canvas.height = innerHeight * devicePixelRatio;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
addEventListener("resize", resize);
resize();

const t0 = performance.now();
(function draw() {
  gl.uniform1f(U("time"), (performance.now() - t0) / 1000);
  gl.uniform2f(U("resolution"), canvas.width, canvas.height);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
